# yaml-language-server: $schema=https://raw.githubusercontent.com/sgnl-actions/schemas/main/metadata.schema.json
name: caep-risk-level-change
description: Transmits a Continuous Access Evaluation Protocol (CAEP) Risk Level Change event as a Security Event Token (SET) to a specified endpoint

inputs:
  subject:
    type: text
    description: Subject identifier JSON (e.g., {"format":"email","email":"user@example.com"})
    required: true
    validation:
      min: 1
      max: 2000

  audience:
    type: text
    description: Intended recipient of the SET (e.g., https://customer.okta.com/)
    required: true
    validation:
      min: 1
      max: 500

  principal:
    type: text
    description: Type of principal whose risk level changed (USER, DEVICE, SESSION, TENANT, ORG_UNIT, GROUP, or a custom URI)
    required: true
    validation:
      min: 1
      max: 500

  current_level:
    type: text
    description: Current risk level (LOW, MEDIUM, HIGH)
    required: true
    validation:
      enum: ["LOW", "MEDIUM", "HIGH"]

  previous_level:
    type: text
    description: Previous risk level (LOW, MEDIUM, HIGH)
    required: false
    validation:
      enum: ["LOW", "MEDIUM", "HIGH"]

  risk_reason:
    type: text
    description: Free-text reason for the risk level change (e.g., PASSWORD_FOUND_IN_DATA_BREACH)
    required: false
    validation:
      max: 1000

  event_timestamp:
    type: text
    description: Unix timestamp (seconds) when the event occurred. Defaults to current time if not provided.
    required: false
    validation:
      max: 20

  initiating_entity:
    type: text
    description: Entity that initiated the risk level change (admin, user, policy, system)
    required: false
    validation:
      enum: ["admin", "user", "policy", "system"]

  reason_admin:
    type: text
    description: Admin-readable reason (JSON i18n object e.g. {"en":"message"} or plain string auto-wrapped)
    required: false
    validation:
      max: 1000

  reason_user:
    type: text
    description: User-readable reason (JSON i18n object e.g. {"en":"message"} or plain string auto-wrapped)
    required: false
    validation:
      max: 1000

  address:
    type: text
    description: Optional destination URL override (defaults to ADDRESS environment variable)
    required: false
    validation:
      min: 1
      max: 500

outputs:
  status:
    type: text
    description: Transmission status ('success' or 'failed')

  statusCode:
    type: number
    description: HTTP response status code

  body:
    type: text
    description: HTTP response body

  retryable:
    type: boolean
    description: Whether the error is retryable (for failed requests)

environment:
  ADDRESS:
    type: text
    description: Base URL for the API
    required: false
  OAUTH2_CLIENT_CREDENTIALS_AUDIENCE:
    type: text
    description: OAuth2 client credentials audience
    required: false
  OAUTH2_CLIENT_CREDENTIALS_AUTH_STYLE:
    type: text
    description: OAuth2 client credentials auth style
    required: false
  OAUTH2_CLIENT_CREDENTIALS_CLIENT_ID:
    type: text
    description: OAuth2 client credentials client ID
    required: false
  OAUTH2_CLIENT_CREDENTIALS_SCOPE:
    type: text
    description: OAuth2 client credentials scope
    required: false
  OAUTH2_CLIENT_CREDENTIALS_TOKEN_URL:
    type: text
    description: OAuth2 client credentials token URL
    required: false

secrets:
  BEARER_AUTH_TOKEN:
    type: text
    description: Bearer auth token
    required: false
  BASIC_USERNAME:
    type: text
    description: Basic auth username
    required: false
  BASIC_PASSWORD:
    type: text
    description: Basic auth password
    required: false
  OAUTH2_CLIENT_CREDENTIALS_CLIENT_SECRET:
    type: text
    description: OAuth2 client secret
    required: false
  OAUTH2_AUTHORIZATION_CODE_ACCESS_TOKEN:
    type: text
    description: OAuth2 authorization code access token
    required: false

optional_one_of:
  - ["secrets.BEARER_AUTH_TOKEN"]
  - ["secrets.BASIC_USERNAME", "secrets.BASIC_PASSWORD"]
  - [
      "secrets.OAUTH2_CLIENT_CREDENTIALS_CLIENT_SECRET",
      "environment.OAUTH2_CLIENT_CREDENTIALS_CLIENT_ID",
      "environment.OAUTH2_CLIENT_CREDENTIALS_TOKEN_URL",
    ]
  - ["secrets.OAUTH2_AUTHORIZATION_CODE_ACCESS_TOKEN"]
